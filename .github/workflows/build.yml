name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build both variants
        run: |
          gradle assembleEmptyDebug assembleFullDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: flibusta-tracker-apk
          path: |
            app/build/outputs/apk/empty/debug/app-empty-debug.apk
            app/build/outputs/apk/full/debug/app-full-debug.apk